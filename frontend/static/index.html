<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M2 16h9.5M20.5 16H30" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <span class="brand">Pokédex</span>
    </div>
  </header>

  <main class="container">
    <section class="search">
      <h1>Find a Pokémon</h1>
      <p class="sub">Search by name to see its stats, abilities, moves and more.</p>

      <form id="search-form" role="search" autocomplete="off">
        <div class="combo">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="search-input" type="text" placeholder="e.g. pikachu" spellcheck="false"
                 role="combobox" aria-label="Pokémon name" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="suggestions" autofocus>
          <ul id="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="submit" class="btn primary">Search</button>
        <button type="button" id="random-btn" class="btn ghost">Random</button>
      </form>
    </section>

    <section id="result" aria-live="polite"></section>
  </main>

  <footer class="footer">Data from <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></footer>

  <script src="app.js"></script>
</body>
</html>
